# MXFS module options, installed as /etc/modprobe.d/mxfs.conf.
#
# force_transport=1 forms a new cluster on the TCP DLM transport, the
# released configuration (2 nodes, TCP).  Without it the module forms a new
# cluster on CAW, which is still in development.  A node joining an existing
# cluster adopts the transport its members already use.
options mxfs force_transport=1

# target_cache_protected=1 declares that the shared storage's write cache
# survives a power loss (battery- or flash-backed, as enterprise SAN and NAS
# arrays provide), or that losing the storage target's power is outside what
# this cluster must survive.  MXFS refuses a clustered mount without it: with
# an unprotected volatile cache, a target power loss could keep a lock
# hand-off while dropping the writes it vouched for.  This is the released,
# tested configuration.  Remove the line only if you intend the crash-durable
# mode (fua_disable=0), which is still in development.
options mxfs target_cache_protected=1
